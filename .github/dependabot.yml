# Keeps every ecosystem in this repo current: npm packages,
# GitHub Actions versions, and the Docker base image.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Bundle routine bumps into one PR; majors still arrive individually.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Uncomment once the Terraform config lands in /terraform:
  # - package-ecosystem: "terraform"
  #   directory: "/terraform"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
